services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: ":80"
      # Configuration du Hub interne FrankenPHP
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Configuration du bundle Symfony
      MERCURE_URL: http://127.0.0.1/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
      MERCURE_JWT_SECRET: '!ChangeThisMercureHubJWTSecretKey!'
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./api:/app
      - ./api/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
    depends_on:
      - database

  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: visualpes
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - default

  pwa:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./pwa:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_MERCURE_URL=http://localhost/.well-known/mercure
    restart: unless-stopped
    networks:
      - default

  # --- Environnement Boutique WordPress / WooCommerce Cloisonné ---
  shop_db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: visualpes_shop
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - shop_db_data:/var/lib/mysql
    networks:
      - shop_net

  shop:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: shop_db:3306
      WORDPRESS_DB_NAME: visualpes_shop
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./shop:/var/www/html
    networks:
      - default
      - shop_net
    depends_on:
      - shop_db

  wp:
    image: wordpress:cli
    user: "33:33"
    volumes:
      - ./shop:/var/www/html
    environment:
      WORDPRESS_DB_HOST: shop_db:3306
      WORDPRESS_DB_NAME: visualpes_shop
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WP_CLI_CACHE_DIR: /tmp/.wp-cli/cache
    networks:
      - default
      - shop_net
    depends_on:
      - shop
      - shop_db

networks:
  default:
  shop_net:

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
  shop_db_data: {}
